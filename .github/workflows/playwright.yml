name: Playwright Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly full regression at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs only; push, nightly and manual runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Keep the image tag in sync with the exact @playwright/test version in package.json.
    # Browsers and Node are preinstalled, so there is no `playwright install` or setup-node step.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 30
    env:
      CI: true
      # Recommended by Playwright for root containers (needed by Firefox; harmless for Chromium/WebKit).
      HOME: /root
      # Optional override via a repository variable; falls back to the public demo.
      BASE_URL: ${{ vars.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint markdown
        run: npm run lint:md

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, videos)
        uses: actions/upload-artifact@v5
        if: ${{ failure() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
