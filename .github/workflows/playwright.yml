name: Playwright Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly full regression at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# PR runs share a group per branch, so a new push cancels the superseded run.
# Push, nightly and manual runs get their own group (run_id), so none is cancelled or replaced while queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Keep the image tag in sync with the exact @playwright/test version in package.json.
    # Browsers and Node are preinstalled, so there is no `playwright install` or setup-node step.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 30
    env:
      CI: true
      # Recommended by Playwright for root containers (needed by Firefox; harmless for Chromium/WebKit).
      HOME: /root
      # Optional override via a repository variable; falls back to the public demo.
      BASE_URL: ${{ vars.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint markdown
        run: npm run lint:md

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, videos)
        uses: actions/upload-artifact@v5
        if: ${{ failure() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      # main only (push, nightly, manual): the report becomes the GitHub Pages site. PR runs keep the artifact only.
      - name: Upload report for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('playwright-report/index.html') != '' }}
        with:
          path: playwright-report/

  # Publishes the latest main report, passing or failing, at https://solcala.github.io/orangehrm-playwright/.
  # Needs Settings → Pages → Source: "GitHub Actions".
  deploy-report:
    needs: test
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deploy at a time; a newer report waits instead of cancelling the one being published.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
