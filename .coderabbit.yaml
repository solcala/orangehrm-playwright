# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: chill
  path_instructions:
    - path: "tests/**/*.spec.ts"
      instructions: >-
        Playwright + TypeScript E2E specs for the OrangeHRM demo. Check:
        import test/expect from '@fixtures/pages', never '@playwright/test'.
        Each test is written as named test.step blocks that read like a manual test case,
        with action steps separate from check steps; flag vague titles, steps that wrap a single line for no reason,
        and dynamic demo data (names, counts, dates) in step titles.
        Use expect.soft only for several independent checks of the same end state (with a message inside loops);
        use a hard expect for preconditions that later steps depend on; if actions must follow soft checks,
        gate them with expect(test.info().errors).toHaveLength(0).
        Only web-first assertions (await expect(locator).toBeVisible(), not expect(await locator.isVisible()));
        no page.waitForTimeout, no .only, no force: true without a comment.
        Every describe has a section tag (e.g. @auth, @pim); @smoke only on critical paths.
        Tests are independent and parallel-safe; test data is self-created with unique names and cleaned up;
        never rely on existing demo records or counts, apart from the Admin user and reference lists
        (job titles, locations) read from the app.
        Never log out of the shared storageState session; logged-out tests opt out with an empty storageState.
    - path: "tests/**/*.setup.ts"
      instructions: >-
        Setup projects (e.g. auth.setup.ts creates the shared admin session every test depends on). Check:
        imports come from '@fixtures/pages'; credentials come from '@fixtures/test-data' (env with public demo
        defaults) and are never hard-coded; the session is saved to STORAGE_STATE from '@fixtures/constants'
        (never import playwright.config.ts); login success is asserted before saving the session.
        Spec-only rules (test.step structure, section tags, data cleanup) do not apply here.
    - path: "pages/**/*.ts"
      instructions: >-
        Page objects. Check: locators are user-facing first: getByRole with name, then getByLabel,
        getByPlaceholder, alt text, getByTitle, getByText (stable static text only, never demo data such as
        names, counts or dates), test id. Scope locators to the nearest landmark or region (banner, navigation,
        main, dialog, table row). For elements without a role, anchor on an accessible element inside that scope.
        CSS only as a last resort, scoped to a stable component; XPath only to step up to a parent container;
        either needs a comment explaining why. Flag generated classes, nth-child, long chains, and locators
        that match demo data.
        Page objects contain locators and actions only, with no assertions apart from expectLoaded()-style helpers.
        Reusable flows may wrap their body in test.step(title, body, { box: true }).
        Shared UI (sidebar, top bar, dropdowns, date pickers, tables) belongs in reusable components.
    - path: "fixtures/**/*.ts"
      instructions: >-
        Fixtures, constants and test data. Check: no secrets or real credentials (only public demo defaults
        read from env); no side effects at import time; generated test data is unique (pw- prefix) and has a
        cleanup path. Fixture helpers may use test.step(..., { box: true }).
    - path: ".github/workflows/**"
      instructions: >-
        CI workflows. Check: the mcr.microsoft.com/playwright image tag matches the exact @playwright/test
        version in package.json; reports and traces are uploaded even when tests fail; no secrets are echoed;
        concurrency cancels superseded runs.
    - path: "{playwright.config.ts,package.json,tsconfig.json}"
      instructions: >-
        Project config. Check: @playwright/test is pinned to an exact version; projects are Chromium and WebKit
        only; tests must not import playwright.config.ts (shared constants live in fixtures/constants.ts);
        TypeScript strict mode stays on.
